<!doctype html>
<html lang="id" data-theme="light" data-mode="mac">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Launcher">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Amatu Launcher</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
 --txt:#1d1d1f;--sub:rgba(0,0,0,.52);--win:rgba(248,248,250,.84);--winbar:rgba(236,236,241,.72);--line:rgba(0,0,0,.1);--menu:rgba(255,255,255,.4);
 --pop:rgba(246,246,249,.84);--glass:rgba(255,255,255,.26);--glassb:rgba(255,255,255,.5);--acc:#0a84ff;--field:rgba(0,0,0,.055);--card:rgba(255,255,255,.62);
 --top:28px;--bot:84px;--wsz:140px;--ds:50px}
html[data-theme=dark]{--txt:#f5f5f7;--sub:rgba(255,255,255,.58);--win:rgba(30,30,34,.84);--winbar:rgba(46,46,52,.7);--line:rgba(255,255,255,.12);--menu:rgba(22,22,26,.42);
 --pop:rgba(38,38,44,.86);--glass:rgba(38,38,44,.34);--glassb:rgba(255,255,255,.16);--field:rgba(255,255,255,.08);--card:rgba(40,40,46,.6)}
html,body{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{position:fixed;inset:0;font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--txt);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg.g{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* wallpaper */
#wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:background .4s}
#wallDim{position:fixed;inset:0;background:rgba(0,0,0,0);transition:background .4s;pointer-events:none}
html[data-theme=dark] #wallDim{background:rgba(0,0,0,.22)}

/* bars */
#menubar,#statusbar{position:fixed;left:0;right:0;top:0;height:var(--top);z-index:950;display:flex;align-items:center;justify-content:space-between;
 padding:var(--st) calc(var(--sr) + 10px) 0 calc(var(--sl) + 10px)}
#menubar{background:var(--menu);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8)}
#statusbar{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.mbl,.mbr{display:flex;align-items:center;gap:2px;height:100%}
.mbb{height:22px;padding:0 9px;border-radius:5px;font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.mbb:active,.mbb.on{background:rgba(127,127,127,.28)}
.mbb.b{font-weight:700}.logo{font-size:15px;padding:0 10px}
.mbi svg{width:16px;height:16px}.mbi{padding:0 7px;display:flex;align-items:center}
#statusbar .mbb{font-weight:600;font-size:14px}
html[data-mode=mac] #statusbar,html[data-mode=ipad] #menubar,html[data-mode=ipad] #deskIcons,html[data-mode=mac] #home{display:none!important}

/* desk */
#desk{position:fixed;top:var(--top);bottom:var(--bot);left:calc(var(--sl) + 12px);right:calc(var(--sr) + 12px);display:flex;gap:18px;padding:10px 0 6px;z-index:1;touch-action:none}
#widgets{display:grid;grid-template-columns:repeat(2,var(--wsz));grid-auto-rows:var(--wsz);gap:12px;align-content:start;flex:none}
.wg{border-radius:20px;background:var(--card);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
 box-shadow:0 6px 20px rgba(0,0,0,.18),inset 0 0 0 .5px var(--glassb);padding:12px;overflow:hidden;position:relative;cursor:pointer;transition:transform .15s}
.wg:active{transform:scale(.96)}
.wclock{display:grid;place-items:center;padding:8px}.wclock svg{width:100%;height:100%}
.wcal .cm{color:#ff3b30;font-weight:700;font-size:10px;letter-spacing:.04em;margin-bottom:3px}
.wcal .cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:calc(var(--wsz)*.066);row-gap:1px}
.wcal .cg b{font-size:calc(var(--wsz)*.058);color:var(--sub);font-weight:600}
.wcal .cg i{font-style:normal;line-height:1.55}.wcal .cg i.td{background:#ff3b30;color:#fff;border-radius:50%;font-weight:700}
.wwx{background:linear-gradient(170deg,#4aa3ff,#1c5fd6);color:#fff;display:flex;flex-direction:column}
html[data-theme=dark] .wwx{background:linear-gradient(170deg,#1b3d78,#0b1d40)}
.wwx .loc{font-size:11px;font-weight:600;opacity:.9}.wwx .tp{font-size:calc(var(--wsz)*.3);font-weight:300;line-height:1.05}
.wwx .ds{font-size:11px;font-weight:600;margin-top:auto;line-height:1.3}.wwx .ds small{display:block;font-weight:500;opacity:.85}
.wwx svg{position:absolute;right:12px;top:12px;width:22px;height:22px}
.wnote{background:linear-gradient(180deg,#fff7d1,#ffeaa0);color:#3b3000}
html[data-theme=dark] .wnote{background:linear-gradient(180deg,#4a4122,#2f2914);color:#f6e7b0}
.wnote h4{font-size:11px;font-weight:700;color:#d89e00;margin-bottom:5px;display:flex;justify-content:space-between}
.wnote p{font-size:12px;line-height:1.35;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;word-break:break-word}

#deskIcons{flex:1;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,82px);grid-auto-columns:78px;direction:rtl;align-content:start;justify-content:start;gap:2px 4px;min-width:0}
#home{flex:1;display:flex;flex-direction:column;min-width:0}
#homePages,.lpPages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none}
#homePages::-webkit-scrollbar,.lpPages::-webkit-scrollbar{display:none}
.hpage{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);align-items:center;justify-items:center}
.dots{display:flex;justify-content:center;gap:7px;height:12px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:#fff}

/* icons */
.ic{width:78px;display:flex;flex-direction:column;align-items:center;gap:5px;direction:ltr;padding-top:4px;transition:transform .12s}
.ic.press{transform:scale(.88)}
.ic span{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ic .tile{width:var(--is,54px)}
.tile{aspect-ratio:1;border-radius:23%;background:linear-gradient(180deg,var(--c1),var(--c2));display:grid;place-items:center;color:var(--fg,#fff);
 box-shadow:0 2px 6px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.28);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%);pointer-events:none}
.tile svg{width:56%;height:56%}
.tile .lt{font-weight:700;font-size:calc(var(--sz,54px)*.44);line-height:1}
.tile .em{font-size:calc(var(--sz,54px)*.52);line-height:1}
.bounce{animation:bn .55s}
@keyframes bn{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}65%{transform:translateY(0)}80%{transform:translateY(-5px)}}

/* dock */
#dockWrap{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 6px);display:flex;justify-content:center;z-index:900;pointer-events:none}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:7px;padding:5px 7px;border-radius:19px;background:var(--glass);touch-action:none;
 -webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 .5px var(--glassb)}
.di{width:var(--ds);position:relative;flex:none}
.di .tile{width:100%;--sz:var(--ds)}
.di.dn .tile{filter:brightness(.8)}
.di.on::after{content:"";position:absolute;left:50%;bottom:-4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--txt);opacity:.75}
.dsep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line);flex:none}
#dockTip{position:fixed;z-index:901;padding:4px 10px;border-radius:7px;background:var(--pop);font-size:12px;font-weight:500;pointer-events:none;
 -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 4px 14px rgba(0,0,0,.2);transform:translateX(-50%);white-space:nowrap}
html[data-mode=ipad] #dock{gap:14px;padding:10px 12px;border-radius:28px}
html[data-mode=ipad] .di.on::after{bottom:-7px}

/* windows */
#wins{position:fixed;inset:0;pointer-events:none;z-index:20}
.win{position:fixed;pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;border-radius:13px;background:var(--win);
 -webkit-backdrop-filter:blur(36px) saturate(1.9);backdrop-filter:blur(36px) saturate(1.9);box-shadow:0 22px 60px rgba(0,0,0,.38),0 0 0 .5px var(--line);
 animation:wo .22s cubic-bezier(.2,.9,.3,1.2);transition:opacity .2s,transform .25s}
.win.min{opacity:0;transform:translateY(60%) scale(.2)}
.win:not(.act) .wbar{opacity:.85}
@keyframes wo{from{opacity:0;transform:scale(.9)}}
.wbar{height:36px;flex:none;display:flex;align-items:center;padding:0 6px;touch-action:none;background:var(--winbar);border-bottom:.5px solid var(--line);position:relative}
.lights{display:flex;z-index:1}
.l{width:24px;height:30px;display:grid;place-items:center}
.l::before{content:"";width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.lc::before{background:#ff5f57}.lm::before{background:#febc2e}.lx::before{background:#28c840}
.win:not(.act) .l::before{background:rgba(127,127,127,.35)}
.wt{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:13px;pointer-events:none;padding:0 90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtools{margin-left:auto;display:flex;gap:4px;z-index:1}
.wbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;touch-action:pan-y}
.grip{position:absolute;right:0;bottom:0;width:26px;height:26px;touch-action:none;cursor:nwse-resize}
.grip::after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0 0 3px 0}

/* controls */
.btn{padding:6px 12px;border-radius:8px;background:var(--field);font-weight:500;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff}.btn.red{color:#ff3b30}.btn:active{opacity:.6}
.btn.sm{padding:4px 9px;font-size:12px}
.fld{width:100%;padding:8px 10px;border-radius:8px;border:0;background:var(--field);outline:none}
.fld:focus{box-shadow:0 0 0 3px rgba(10,132,255,.35)}
.seg{display:inline-flex;background:var(--field);border-radius:9px;padding:2px}
.seg button{padding:5px 13px;border-radius:7px;font-weight:500;font-size:12.5px}
.seg button.on{background:var(--win);box-shadow:0 1px 3px rgba(0,0,0,.2)}
html[data-theme=dark] .seg button.on{background:rgba(255,255,255,.18)}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(127,127,127,.35);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:#34c759}.tg.on::after{transform:translateX(18px)}
.pill{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--field);color:var(--sub)}
.pill.on{background:var(--acc);color:#fff}

/* settings / lists */
.pane{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.grp h5{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:0 4px 6px}
.box{background:var(--field);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;min-height:42px}
.row+.row{border-top:.5px solid var(--line)}
.row .k{flex:1;min-width:0}.row .k small{display:block;color:var(--sub);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.walls{display:flex;gap:9px;flex-wrap:wrap;padding:10px 12px}
.walls button{width:62px;height:40px;border-radius:8px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.walls button.on{box-shadow:0 0 0 2px var(--win),0 0 0 4px var(--acc)}
input[type=range]{flex:1;accent-color:var(--acc)}
.help li{margin:0 0 6px 18px;line-height:1.45}

/* apps manager */
.atool{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--win);border-bottom:.5px solid var(--line);flex-wrap:wrap}
.arow{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:.5px solid var(--line)}
.arow .tile{width:34px;--sz:34px;flex:none}
.arow .k{flex:1;min-width:0}.arow .k b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .k small{color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--field);flex:none}
.ib svg{width:15px;height:15px}.ib:disabled{opacity:.3}

/* notes */
.notes{display:flex;height:100%}
.nlist{width:36%;max-width:220px;border-right:.5px solid var(--line);overflow:auto;flex:none}
.nlist button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:.5px solid var(--line)}
.nlist button.on{background:rgba(255,204,0,.32)}
.nlist b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nlist small{color:var(--sub);font-size:11px}
.ned{flex:1;display:flex;flex-direction:column;min-width:0}
.ned textarea{flex:1;border:0;outline:none;resize:none;background:transparent;padding:12px 14px;font-size:15px;line-height:1.45}

/* calculator */
.calc{display:flex;flex-direction:column;height:100%;background:#1c1c1e;color:#fff;padding:8px}
.cdisp{flex:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:2px 8px 8px;height:64px;overflow:hidden}
.cdisp small{color:#8e8e93;font-size:13px;white-space:nowrap}.cdisp b{font-size:34px;font-weight:300;white-space:nowrap}
.ckeys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:6px}
.ckeys button{min-height:0;border-radius:999px;background:#3a3a3c;font-size:clamp(15px,4.4vh,20px);font-weight:500}
.ckeys button.op{background:#ff9f0a}.ckeys button.fn{background:#a5a5a5;color:#000}.ckeys button:active{filter:brightness(1.4)}

/* overlays */
#launchpad{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(34px) saturate(1.3);backdrop-filter:blur(34px) saturate(1.3);
 display:flex;flex-direction:column;padding:calc(var(--st) + 14px) calc(var(--sr) + 24px) calc(var(--sb) + 10px) calc(var(--sl) + 24px);opacity:0;transform:scale(1.08);transition:opacity .22s,transform .22s}
#launchpad.on{opacity:1;transform:none}
.lpq{align-self:center;width:min(240px,60vw);padding:6px 10px 6px 30px;border-radius:9px;border:0;outline:none;background:rgba(255,255,255,.2) no-repeat 9px center;color:#fff;
 box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3);margin-bottom:8px}
.lpq::placeholder{color:rgba(255,255,255,.7)}
.lpPages .hpage .ic .tile{--is:56px}
#spot{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.12)}
.spbox{position:absolute;left:50%;top:calc(var(--top) + 18px);transform:translateX(-50%);width:min(560px,calc(100vw - var(--sl) - var(--sr) - 30px));
 background:var(--pop);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 0 0 .5px var(--glassb);overflow:hidden;animation:wo .18s}
.spin{display:flex;align-items:center;gap:10px;padding:10px 14px}.spin svg{width:20px;height:20px;color:var(--sub);flex:none}
.spin input{flex:1;border:0;outline:none;background:none;font-size:20px;font-weight:300}
.sres{max-height:calc(100vh - var(--top) - 110px);overflow:auto;border-top:.5px solid var(--line)}
.sres:empty{display:none}
.sr{display:flex;align-items:center;gap:10px;padding:7px 14px;width:100%;text-align:left}
.sr .tile{width:26px;--sz:26px;flex:none}.sr.sel{background:var(--acc);color:#fff}.sr small{margin-left:auto;opacity:.6;font-size:11px}
.sr .gi{width:26px;height:26px;display:grid;place-items:center;flex:none}.sr .gi svg{width:18px;height:18px}
#cc{position:fixed;z-index:1050;top:calc(var(--top) + 6px);right:calc(var(--sr) + 8px);width:300px;padding:10px;border-radius:18px;background:var(--pop);
 -webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);box-shadow:0 20px 50px rgba(0,0,0,.3),inset 0 0 0 .5px var(--glassb);
 display:grid;grid-template-columns:1fr 1fr;gap:8px;animation:wo .18s;max-height:calc(100vh - var(--top) - 12px);overflow:auto}
.cct{border-radius:13px;background:var(--field);padding:10px;display:flex;align-items:center;gap:9px;text-align:left;min-height:52px}
.cct .ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.25);flex:none}
.cct .ci svg{width:16px;height:16px}.cct.on .ci{background:var(--acc);color:#fff}
.cct b{display:block;font-size:12px}.cct small{font-size:11px;color:var(--sub)}
.cct.w{grid-column:span 2}
#pop{position:fixed;inset:0;z-index:1300}
.popbox{position:fixed;min-width:210px;max-width:280px;padding:5px;border-radius:11px;background:var(--pop);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);
 box-shadow:0 14px 40px rgba(0,0,0,.3),inset 0 0 0 .5px var(--glassb);animation:wo .14s;max-height:calc(100vh - 20px);overflow:auto}
.mi{display:flex;width:100%;align-items:center;gap:10px;padding:7px 11px;border-radius:6px;text-align:left;font-size:13.5px}
.mi:active,.mi:hover{background:var(--acc);color:#fff}.mi small{margin-left:auto;opacity:.55}.mi.dis{opacity:.4;pointer-events:none}.mi.red{color:#ff3b30}
.popbox .sep{height:.5px;background:var(--line);margin:4px 8px}
.pophd{padding:6px 11px 4px;font-size:11px;font-weight:600;color:var(--sub)}
#sheet{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.3);display:grid;place-items:center;padding:12px calc(var(--sr) + 12px) calc(var(--sb) + 8px) calc(var(--sl) + 12px)}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--win);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:wo .2s}
.shd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--line);position:sticky;top:0;background:var(--win);z-index:1}
.shd b{flex:1;font-size:15px}
.sbody{padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.sbody label{font-weight:500;color:var(--sub);font-size:12.5px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.gl button{height:34px;border-radius:8px;display:grid;place-items:center;background:var(--field)}.gl button svg{width:18px;height:18px}
.gl button.on{background:var(--acc);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw button{width:28px;height:28px;border-radius:50%}
.sw button.on{box-shadow:0 0 0 2px var(--win),0 0 0 4px var(--acc)}
.hint{grid-column:1/-1;font-size:11.5px;color:var(--sub);line-height:1.45;background:var(--field);border-radius:8px;padding:8px 10px}

function normalize(){
 const ids=new Set(S.apps.map(a=>a.id));
 S.dock=[...new Set(S.dock)].filter(i=>ids.has(i)); S.desk=[...new Set(S.desk)].filter(i=>ids.has(i));

 S.recent=(S.recent||[]).filter(i=>ids.has(i));
}

/* ---------- utils ---------- */
let toastT;
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
function tileHTML(a,sz){
 const st=`--c1:${a.c?.[0]||'#888'};--c2:${a.c?.[1]||'#555'};${a.fg?`--fg:${a.fg};`:''}${sz?`--sz:${sz}px;`:''}`;
 let inner;
 if(a.emoji)inner=`<span class="em">${esc(a.emoji)}</span>`;
 else if(G[a.g])inner=svg(G[a.g]);
 else inner=`<span class="lt">${esc((a.name||'?').trim().charAt(0).toUpperCase())}</span>`;
 return `<div class="tile" style="${st}">${inner}</div>`;
}
function iconEl(id,{label=true}={}){
 const a=A(id);const d=document.createElement('div');d.className='ic';d.dataset.id=id;
 d.innerHTML=tileHTML(a)+(label?`<span>${esc(a.name)}</span>`:'');bindPress(d,id);return d;
}
function bindPress(el,id){
 let st=null;
 el.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  st={x:e.clientX,y:e.clientY,long:false,t:setTimeout(()=>{if(!st)return;st.long=true;el.classList.remove('press');appMenu(id,st.x,st.y)},480)};
  el.classList.add('press');
 });
 el.addEventListener('pointermove',e=>{if(st&&!st.long&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>9){clearTimeout(st.t);el.classList.remove('press');st=null}});
 const end=e=>{if(!st)return;clearTimeout(st.t);el.classList.remove('press');const s=st;st=null;if(e.type==='pointerup'&&!s.long)launch(id,el.querySelector('.tile'))};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* ---------- launching ---------- */
function bounce(el){if(!el)return;el.classList.remove('bounce');void el.offsetWidth;el.classList.add('bounce')}
function launch(id,el){
 const a=A(id);if(!a)return;
 if(el)bounce(el);
 if(!a.b||a.b==='launchpad'||a.b==='spotlight'){}
 if(a.b!=='launchpad')closeLaunchpad(true);
 closeSpot();closeCC();
 if(a.b){openBuiltin(a.b);return}
 pushRecent(id);
 let u=(a.url||'').trim();
 if(!u){toast(`Alamat untuk ${a.name} belum diisi — tahan ikon lalu pilih Edit.`);return}
 if(a.kind==='shortcut')u='shortcuts://run-shortcut?name='+encodeURIComponent(u);
 if(/^https?:/i.test(u)){window.open(u,'_blank');return}
 openScheme(u,a.name);
}
function openScheme(u,name){
 let left=false;const off=()=>{left=true};
 addEventListener('blur',off,{once:true});addEventListener('pagehide',off,{once:true});document.addEventListener('visibilitychange',off,{once:true});
 setTimeout(()=>{location.href=u},60);
 setTimeout(()=>{if(!left&&!document.hidden)toast(`${name} belum terbuka. Pastikan aplikasinya terpasang di iPhone ini.`,3400)},2600);
}
function pushRecent(id){
 if(S.dock.includes(id))return;
 S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,6);save();setTimeout(renderDock,450);
}
function openBuiltin(b){
 if(b==='launchpad')return toggleLaunchpad();
 if(b==='spotlight')return openSpot();
 openWin(b);
}

/* ---------- popover ---------- */
function popMenu(items,anchor,px,py){
 const p=$('#pop');p.innerHTML='';const box=document.createElement('div');box.className='popbox';
 for(const it of items){
  if(it==='-'){box.insertAdjacentHTML('beforeend','<div class="sep"></div>');continue}
  if(it.hd){box.insertAdjacentHTML('beforeend',`<div class="pophd">${esc(it.hd)}</div>`);continue}
  const b=document.createElement('button');b.className='mi'+(it.dis?' dis':'')+(it.red?' red':'');
  b.innerHTML=`<span>${esc(it.t)}</span>${it.k?`<small>${esc(it.k)}</small>`:''}`;
  b.onclick=e=>{e.stopPropagation();closePop();it.f&&it.f()};box.append(b);
 }
 p.append(box);p.hidden=false;
 $$('.mbb.on').forEach(x=>x.classList.remove('on'));
 let x=px,y=py;
 if(anchor){const r=anchor.getBoundingClientRect();x=r.left;y=r.bottom+4;anchor.classList.add('on')}
 const bw=box.offsetWidth,bh=box.offsetHeight;
 x=Math.max(8,Math.min(x,innerWidth-bw-8));
 if(y+bh>innerHeight-8)y=Math.max(8,(py??y)-bh-8);
 box.style.left=x+'px';box.style.top=y+'px';
}
function closePop(){const p=$('#pop');p.hidden=true;p.innerHTML='';$$('.mbb.on').forEach(x=>x.classList.remove('on'))}
$('#pop').addEventListener('pointerdown',e=>{if(e.target.id==='pop'){e.preventDefault();closePop()}});

function appMenu(id,x,y){
 const a=A(id);if(!a)return;
 const inDock=S.dock.includes(id),inDesk=S.desk.includes(id);
 popMenu([{hd:a.name},{t:'Buka',f:()=>launch(id)},'-',
  {t:inDock?'Keluarkan dari Dock':'Tambahkan ke Dock',f:()=>toggleIn('dock',id)},
  ...(S.mode==='mac'?[{t:inDesk?'Hapus dari Desktop':'Taruh di Desktop',f:()=>toggleIn('desk',id)}]:[]),
  {t:'Edit ikon & alamat…',f:()=>editApp(id)},
  ...(a.b?[]:[{t:'Hapus aplikasi',red:1,f:()=>delApp(id)}])],null,x+6,y+6);
}
function toggleIn(list,id){const L=S[list];const i=L.indexOf(id);if(i>=0)L.splice(i,1);else L.push(id);save();renderLayout();refreshWin('apps')}
function delApp(id){
 const a=A(id);if(!a||a.b)return;
 if(!confirm(`Hapus "${a.name}" dari launcher?\n(Aplikasi di iPhone tidak ikut terhapus.)`))return;
 S.apps=S.apps.filter(x=>x.id!==id);normalize();save();renderLayout();refreshWin('apps');toast(`${a.name} dihapus dari launcher`);
}

function clockSVG(){
 let t='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180,r1=i%3?41:38;t+=`<line x1="${50+r1*Math.sin(a)}" y1="${50-r1*Math.cos(a)}" x2="${50+44*Math.sin(a)}" y2="${50-44*Math.cos(a)}" stroke="currentColor" stroke-width="${i%3?1.2:2.4}" stroke-linecap="round" opacity=".75"/>`}
 return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="var(--win)" opacity=".55"/>${t}
  <text x="50" y="68" text-anchor="middle" font-size="8" fill="currentColor" opacity=".55" font-weight="600">${esc(fmtD(new Date()).toUpperCase())}</text>
  <line class="hh" x1="50" y1="54" x2="50" y2="27" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line class="mm" x1="50" y1="56" x2="50" y2="14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line class="ss" x1="50" y1="60" x2="50" y2="12" stroke="#ff9500" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2.8" fill="#ff9500"/></svg>`;
}
function calHTML(){
 const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 let c='';for(let i=0;i<first;i++)c+='<i></i>';for(let k=1;k<=days;k++)c+=`<i${k===d.getDate()?' class="td"':''}>${k}</i>`;
 return `<div class="cm">${esc(d.toLocaleDateString('id-ID',{month:'long'}).toUpperCase())}</div><div class="cg">${['S','S','R','K','J','S','M'].map(x=>`<b>${x}</b>`).join('')}${c}</div>`;
}
function wxHTML(){
 const w=S.weather;
 if(!w||w.t==null)return `${svg(UI.sun)}<div class="loc">Cuaca</div><div class="tp">--°</div><div class="ds">Ketuk untuk aktifkan</div>`;
 const [txt,ic]=WX[w.code]||['—','cloud'];
 return `${svg(WXI[ic])}<div class="loc">Lokasi Anda</div><div class="tp">${w.t}°</div><div class="ds">${esc(txt)}<small>T:${w.hi}°  R:${w.lo}°</small></div>`;
}

 const n=(LS.get(NKEY,[])||[])[0];
 return `<h4><span>CATATAN</span><span>${n?esc(new Date(n.u).toLocaleDateString('id-ID',{day:'numeric',month:'short'})):''}</span></h4><p>${n&&n.t.trim()?esc(n.t):'Ketuk untuk menulis catatan cepat…'}</p>`;

function renderWidgets(){
 const w=$('#widgets');w.hidden=!S.widgets;if(!S.widgets){w.innerHTML='';return}
 w.innerHTML=`<div class="wg wclock" data-w="clock">${clockSVG()}</div><div class="wg wcal" data-w="cal">${calHTML()}</div>
  <div class="wg wwx" data-w="wx">${wxHTML()}</div><div class="wg wnote" data-w="note">${noteHTML()}</div>`;

$('#widgets').addEventListener('click',e=>{
 const w=e.target.closest('[data-w]');if(!w)return;
 ({clock:()=>launch('clock'),cal:()=>launch('calendar'),note:()=>openWin('notes'),
   wx:()=>{if(!S.weather||S.weather.lat==null)wxAsk();else{wxFetch(true);launch('weather')}}})[w.dataset.w]?.();
});
async function wxFetch(force){
 const w=S.weather;if(!w||w.lat==null)return;
 if(!force&&w.at&&Date.now()-w.at<20*60e3)return;
 try{
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat.toFixed(3)}&longitude=${w.lon.toFixed(3)}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
  const j=await r.json();
  Object.assign(w,{t:Math.round(j.current.temperature_2m),code:j.current.weather_code,hi:Math.round(j.daily.temperature_2m_max[0]),lo:Math.round(j.daily.temperature_2m_min[0]),at:Date.now()});
  save();renderWidgets();
 }catch{}
}
function wxAsk(){
 if(!navigator.geolocation)return toast('Lokasi tidak tersedia di perangkat ini');
 toast('Meminta izin lokasi untuk cuaca…');
 navigator.geolocation.getCurrentPosition(p=>{S.weather={lat:p.coords.latitude,lon:p.coords.longitude};save();wxFetch(true)},
  ()=>toast('Izin lokasi ditolak — widget cuaca tidak aktif'),{timeout:12000,maximumAge:3600e3});
}

function renderDesk(){const d=$('#deskIcons');d.innerHTML='';S.desk.forEach(id=>d.append(iconEl(id)))}
function pageGrid(container,dots,ids,cellW,cellH){
 container.innerHTML='';dots.innerHTML='';
 const r=container.getBoundingClientRect();
 const cols=Math.max(1,Math.floor(r.width/cellW)),rows=Math.max(1,Math.floor(r.height/cellH)),per=cols*rows;
 const pages=Math.max(1,Math.ceil(ids.length/per));
 for(let p=0;p<pages;p++){
  const pg=document.createElement('div');pg.className='hpage';pg.style.setProperty('--cols',cols);pg.style.setProperty('--rows',rows);
  ids.slice(p*per,(p+1)*per).forEach(id=>pg.append(iconEl(id)));container.append(pg);
  if(pages>1)dots.insertAdjacentHTML('beforeend',`<i${p?'':' class="on"'}></i>`);
 }
 container.scrollLeft=0;

/* ---------- app: Kalkulator ---------- */
function evalExpr(src){
 const s=String(src).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.').replace(/\s+/g,'');
 if(!s||!/^[\d.+\-*/%()^]+$/.test(s))return null;
 let i=0;const peek=()=>s[i];
 function prim(){
  if(peek()==='('){i++;const v=expr();if(peek()!==')')throw 0;i++;return v}
  const m=/^\d*\.?\d+(?:e[+-]?\d+)?|^\d+\./.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
 }
 function post(){let v=prim();while(peek()==='%'){i++;v/=100}return v}
 function un(){if(peek()==='-'){i++;return -un()}if(peek()==='+'){i++;return un()}return post()}
 function pw(){const b=un();if(peek()==='^'){i++;return Math.pow(b,pw())}return b}
 function term(){let v=pw();while(peek()==='*'||peek()==='/'){const o=s[i++],r=pw();v=o==='*'?v*r:v/r}return v}
 function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++],r=term();v=o==='+'?v+r:v-r}return v}
 try{const v=expr();return i===s.length&&isFinite(v)?v:null}catch{return null}
}
const fmtN=v=>{const r=Math.abs(v)>=1e15||(Math.abs(v)<1e-9&&v!==0)?v.toExponential(6):v.toLocaleString('id-ID',{maximumFractionDigits:10});return r};
function buildCalc(body){

 body.innerHTML=`<div class="calc"><div class="cdisp"><small id="cex">&nbsp;</small><b id="cres">0</b></div><div class="ckeys">
  ${[['AC','fn'],['⌫','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['( )','fn'],['0'],[','],['=','op']]
   .map(([k,c])=>`<button class="${c||''}" data-k="${k}">${k}</button>`).join('')}</div></div>`;
 const show=()=>{$('#cex',body).textContent=ex||' ';const b=$('#cres',body);b.textContent=res;b.style.fontSize=res.length>12?'22px':res.length>9?'28px':''};
 $('.ckeys',body).onclick=e=>{
  const k=e.target.closest('button')?.dataset.k;if(!k)return;
  if(k==='AC'){ex='';res='0';done=false}
  else if(k==='⌫'){ex=ex.slice(0,-1)}
  else if(k==='='){const v=evalExpr(ex);if(v!=null){res=fmtN(v);done=true;show();ex=String(+v.toPrecision(12)).replace('.',',');return}else res='Error'}
  else if(k==='( )'){const o=(ex.match(/\(/g)||[]).length,c=(ex.match(/\)/g)||[]).length;ex+=(o>c&&/[\d)%]$/.test(ex))?')':'('}
  else{if(done&&/[\d,]/.test(k))ex='';ex+=k}
  done=k==='='?done:false;
  if(k!=='='){const v=evalExpr(ex);if(v!=null)res=fmtN(v);else if(!ex)res='0'}
  show();
 };
}

/* ---------- app: Pengaturan ---------- */
function setOpt(k,v){S[k]=v;save();applyAll();refreshWin('settings')}
function nextWall(){const ks=Object.keys(WALLS);setOpt('wall',ks[(ks.indexOf(S.wall)+1)%ks.length])}
function buildSettings(body){
 const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(([v,t])=>`<button data-v="${v}" class="${S[k]===v?'on':''}">${t}</button>`).join('')}</div>`;
 const tg=k=>`<button class="tg${S[k]?' on':''}" data-tg="${k}"></button>`;
 const hasPhoto=!!LS.raw(PKEY);
 body.innerHTML=`<div class="pane">
 <div class="grp"><h5>Tampilan</h5><div class="box">
  <div class="row"><div class="k">Gaya<small>macOS: menu bar + Dock + desktop · iPadOS: layar utama berhalaman</small></div>${seg('mode',[['mac','macOS'],['ipad','iPadOS']])}</div>
  <div class="row"><div class="k">Tema</div>${seg('theme',[['auto','Otomatis'],['light','Terang'],['dark','Gelap']])}</div>
  <div class="row"><div class="k">Widget di desktop<small>Jam, kalender, cuaca, catatan</small></div>${tg('widgets')}</div>
  <div class="row"><div class="k">Format 24 jam</div>${tg('h24')}</div></div></div>
 <div class="grp"><h5>Wallpaper</h5><div class="box"><div class="walls">
  ${Object.entries(WALLS).map(([k,w])=>`<button data-w="${k}" class="${S.wall===k?'on':''}" style="background:${w.bg}" title="${w.n}"></button>`).join('')}
  ${hasPhoto?`<button data-w="photo" class="${S.wall==='photo'?'on':''}" style="background:${wallBG('photo')};background-size:cover"></button>`:''}</div>
  <div class="row"><div class="k">Foto sendiri<small>Pilih dari galeri iPhone</small></div><label class="btn sm">Pilih foto…<input type="file" accept="image/*" id="wfile" hidden></label></div></div></div>
 <div class="grp"><h5>Dock</h5><div class="box">
  <div class="row"><div class="k" style="flex:none;width:90px">Ukuran</div><input type="range" min="34" max="66" value="${S.dockSize}" id="dsz"><span style="width:34px;text-align:right">${S.dockSize}</span></div>
  <div class="row"><div class="k">Perbesar saat digeser<small>Geser jari di Dock, lepas untuk membuka</small></div>${tg('mag')}</div>
  <div class="row"><div class="k">Atur isi Dock & Desktop</div><button class="btn sm" data-go="apps">Buka Aplikasi…</button></div></div></div>
 <div class="grp"><h5>Data</h5><div class="box">
  <div class="row"><div class="k">Cadangan<small>Simpan/pulihkan susunan ikon & setelan</small></div><button class="btn sm" id="bexp">Ekspor</button><label class="btn sm">Impor<input type="file" accept="application/json,.json" id="bimp" hidden></label></div>
  <div class="row"><div class="k">Atur ulang<small>Kembali ke susunan awal (catatan tetap)</small></div><button class="btn sm red" id="breset">Reset</button></div></div></div>
 <div class="grp"><h5>Cara pakai</h5><div class="box" style="padding:12px 12px 6px"><ul class="help">
  <li><b>Ketuk</b> ikon untuk membuka aplikasi iPhone.</li>
  <li><b>Tahan</b> ikon → tambah/keluarkan dari Dock, taruh di desktop, edit, atau hapus.</li>
  <li><b>Geser jari di Dock</b> untuk memperbesar ikon, lepas di atas ikon untuk membuka; angkat jari ke atas untuk batal.</li>
  <li>Di desktop: <b>geser ke atas</b> = Launchpad, <b>geser ke bawah</b> = Cari.</li>
  <li>Jendela: tarik judul untuk memindah, sudut kanan-bawah untuk ubah ukuran, tombol hijau = maksimal.</li>
  <li>Aplikasi tanpa skema URL (mis. Kamera, m-banking) → tambah sebagai <b>Pintasan</b>.</li>
  <li>Matikan <b>Kunci Orientasi</b> di Pusat Kontrol agar bisa landscape.</li></ul></div></div>
 </div>`;
 $$('.seg[data-k]',body).forEach(s=>s.onclick=e=>{const b=e.target.closest('button');if(b)setOpt(s.dataset.k,b.dataset.v)});
 $$('[data-tg]',body).forEach(b=>b.onclick=()=>setOpt(b.dataset.tg,!S[b.dataset.tg]));
 $$('[data-w]',body).forEach(b=>b.onclick=()=>setOpt('wall',b.dataset.w));
 $$('[data-go]',body).forEach(b=>b.onclick=()=>openWin(b.dataset.go));
 const r=$('#dsz',body);r.oninput=()=>{S.dockSize=+r.value;r.nextElementSibling.textContent=r.value;renderDock();renderHome()};r.onchange=save;
 $('#wfile',body).onchange=e=>{const f=e.target.files[0];if(f)loadPhoto(f)};
 $('#bexp',body).onclick=()=>{const blob=new Blob([JSON.stringify({launcher:S,notes:LS.get(NKEY,[])},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='launcher-cadangan.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
 $('#bimp',body).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.launcher?.apps)throw 0;
  S=Object.assign(DEFAULTS(),j.launcher);normalize();if(Array.isArray(j.notes))LS.set(NKEY,j.notes);save();applyAll();refreshWin('settings');toast('Cadangan dipulihkan')}catch{toast('File cadangan tidak valid')}};
 $('#breset',body).onclick=()=>{if(!confirm('Atur ulang susunan & setelan launcher?'))return;LS.raw(PKEY,null);S=DEFAULTS();save();applyAll();refreshWin('settings');refreshWin('apps');toast('Launcher diatur ulang')};
}
function loadPhoto(f){
 const img=new Image(),url=URL.createObjectURL(f);
 img.onload=()=>{const M=1800,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  let q=.85,d=c.toDataURL('image/jpeg',q);while(d.length>2.6e6&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}
  if(!LS.raw(PKEY,d))return toast('Foto terlalu besar untuk disimpan');setOpt('wall','photo');toast('Wallpaper diganti')};
 img.onerror=()=>toast('Foto tidak bisa dibaca');img.src=url;
}
function buildAbout(body){
 body.innerHTML=`<div class="pane" style="align-items:center;text-align:center;gap:10px;padding-top:22px">
  <img src="icon-180.png" width="72" height="72" style="border-radius:17px;box-shadow:0 4px 14px rgba(0,0,0,.25)" alt="">
  <b style="font-size:17px">Amatu Launcher</b><span style="color:var(--sub)">Versi ${VERSION} · gaya macOS & iPadOS untuk iPhone</span>
  <span style="color:var(--sub);font-size:12px;max-width:340px;line-height:1.45">${standalone?'Berjalan sebagai aplikasi layar penuh.':'Pasang lewat profil (AirDrop) atau Safari → Bagikan → Tambahkan ke Layar Utama agar tampil layar penuh.'}<br>Data Anda tersimpan hanya di iPhone ini.</span>
  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" data-go="settings">Pengaturan…</button><button class="btn" data-go="apps">Atur Aplikasi…</button></div></div>`;
 $$('[data-go]',body).forEach(b=>b.onclick=()=>openWin(b.dataset.go));
}

/* ---------- Launchpad ---------- */
const lp=$('#launchpad');
function openLaunchpad(){closeSpot();closeCC();lp.hidden=false;$('#lpq').value='';renderLP();requestAnimationFrame(()=>lp.classList.add('on'))}
function closeLaunchpad(now){if(lp.hidden)return;lp.classList.remove('on');$('#lpq').blur();if(now)lp.hidden=true;else setTimeout(()=>{if(!lp.classList.contains('on'))lp.hidden=true},220)}
const toggleLaunchpad=()=>lp.hidden?openLaunchpad():closeLaunchpad();
function renderLP(){
 const q=$('#lpq').value.trim().toLowerCase();
 const ids=S.order.filter(id=>id!=='launchpad'&&(!q||A(id).name.toLowerCase().includes(q)));
 pageGrid($('#lpPages'),$('#lpDots'),ids,innerWidth>innerHeight?96:88,96);
}
$('#lpq').addEventListener('input',renderLP);
lp.addEventListener('click',e=>{if(e.target===lp||e.target.classList.contains('hpage')||e.target.id==='lpPages'||e.target.id==='lpDots')closeLaunchpad()});

/* ---------- Spotlight ---------- */
const sp=$('#spot');let spSel=0,spItems=[];
function openSpot(){closeLaunchpad(true);closeCC();sp.hidden=false;const i=$('#spq');i.value='';renderSpot();setTimeout(()=>i.focus(),30)}
function closeSpot(){if(sp.hidden)return;sp.hidden=true;$('#spq').blur()}
function renderSpot(){
 const q=$('#spq').value.trim(),ql=q.toLowerCase(),R=$('#spr');spItems=[];
 if(q){
  const v=/[\d)][+\-*/×÷%^]|^\(|%$/.test(q)?evalExpr(q):null;
  if(v!=null)spItems.push({h:`<span class="gi">${svg(G.calc)}</span><b>= ${esc(fmtN(v))}</b><small>Kalkulator</small>`,f:()=>{navigator.clipboard?.writeText(String(v));toast('Hasil disalin')}});
  S.apps.filter(a=>a.name.toLowerCase().includes(ql)).sort((a,b)=>a.name.toLowerCase().indexOf(ql)-b.name.toLowerCase().indexOf(ql)).slice(0,7)
   .forEach(a=>spItems.push({h:`${tileHTML(a,26)}<span>${esc(a.name)}</span><small>${a.b?'Launcher':'Aplikasi'}</small>`,f:()=>launch(a.id)}));
  if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(q)||/^https?:\/\//i.test(q)){const u=/^https?:/i.test(q)?q:'https://'+q;spItems.push({h:`<span class="gi">${svg(G.globe)}</span><span>Buka ${esc(q)}</span><small>Web</small>`,f:()=>window.open(u,'_blank')})}
  spItems.push({h:`<span class="gi">${svg(G.search)}</span><span>Cari “${esc(q)}” di Google</span><small>Web</small>`,f:()=>window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')});
 }
 spSel=0;R.innerHTML='';
 spItems.forEach((it,i)=>{const b=document.createElement('button');b.className='sr'+(i===0?' sel':'');b.innerHTML=it.h;b.onclick=()=>{closeSpot();it.f()};R.append(b)});
}
$('#spq').addEventListener('input',renderSpot);
$('#spq').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&spItems[spSel]){e.preventDefault();const it=spItems[spSel];closeSpot();it.f()}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();spSel=Math.max(0,Math.min(spItems.length-1,spSel+(e.key==='ArrowDown'?1:-1)));$$('.sr').forEach((b,i)=>b.classList.toggle('sel',i===spSel))}
});
sp.addEventListener('pointerdown',e=>{if(e.target===sp)closeSpot()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closePop();closeSpot();closeLaunchpad();closeCC()}
 if((e.metaKey||e.ctrlKey)&&e.key===' '){e.preventDefault();openSpot()}
});

/* ---------- Control Center ---------- */
const cc=$('#cc');
function toggleCC(){cc.hidden?openCC():closeCC()}
function closeCC(){cc.hidden=true}
function openCC(){
 closeSpot();closeLaunchpad(true);
 const th={auto:['Otomatis',UI.auto],light:['Terang',UI.sun],dark:['Gelap',UI.moon]}[S.theme];
 cc.innerHTML=`
  <button class="cct on" data-c="mode"><span class="ci">${svg(S.mode==='mac'?UI.mac:UI.ipad)}</span><span><b>${S.mode==='mac'?'macOS':'iPadOS'}</b><small>Ganti gaya</small></span></button>
  <button class="cct${S.theme!=='light'?' on':''}" data-c="theme"><span class="ci">${svg(th[1])}</span><span><b>Tema</b><small>${th[0]}</small></span></button>
  <button class="cct" data-c="wall"><span class="ci">${svg(UI.img)}</span><span><b>Wallpaper</b><small>${esc(WALLS[S.wall]?.n||'Foto')}</small></span></button>
  <button class="cct${S.widgets?' on':''}" data-c="widgets"><span class="ci">${svg(UI.widget)}</span><span><b>Widget</b><small>${S.widgets?'Tampil':'Sembunyi'}</small></span></button>
  <button class="cct${S.mag?' on':''}" data-c="mag"><span class="ci">${svg(UI.mag)}</span><span><b>Perbesar Dock</b><small>${S.mag?'Aktif':'Mati'}</small></span></button>
  <button class="cct" data-c="lp"><span class="ci">${svg(G.grid)}</span><span><b>Launchpad</b><small>Semua aplikasi</small></span></button>
  <div class="cct w"><span class="ci">${svg(UI.dock)}</span><input type="range" min="34" max="66" value="${S.dockSize}" id="ccd"></div>
  <button class="cct" data-c="isettings"><span class="ci">${svg(G.gear)}</span><span><b>Pengaturan</b><small>iPhone</small></span></button>
  <button class="cct" data-c="lset"><span class="ci">${svg(G.sliders)}</span><span><b>Launcher</b><small>Setelan</small></span></button>`;
 cc.hidden=false;
 const r=$('#ccd',cc);r.oninput=()=>{S.dockSize=+r.value;renderDock();renderHome()};r.onchange=save;
}
cc.addEventListener('click',e=>{
 const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
 if(c==='mode')setOpt('mode',S.mode==='mac'?'ipad':'mac');
 else if(c==='theme')setOpt('theme',{auto:'light',light:'dark',dark:'auto'}[S.theme]);
 else if(c==='wall')nextWall();
 else if(c==='widgets'||c==='mag')setOpt(c,!S[c]);
 else if(c==='lp'){closeCC();openLaunchpad();return}
 else{closeCC();launch(c==='lset'?'lset':'isettings');return}
 openCC();
});
document.addEventListener('pointerdown',e=>{if(!cc.hidden&&!e.target.closest('#cc,[data-m=cc]'))closeCC()},true);

/* ---------- layout ---------- */
function layout(){
 const R=$('#desk').getBoundingClientRect(),port=innerHeight>innerWidth;
 const wsz=port?Math.min(160,Math.floor((R.width-12)/2)):Math.max(96,Math.min(168,Math.floor((R.height-16-12)/2)));
 document.documentElement.style.setProperty('--wsz',wsz+'px');
}
function renderLayout(){renderDock();layout();renderDesk();renderHome()}
function applyAll(){applyTheme();renderWall();renderBars();renderWidgets();renderLayout()}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{renderLayout();if(!lp.hidden)renderLP()},120)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick(true);wxFetch()}});

/* ---------- boot ---------- */
applyAll();
wxFetch();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(isIOS&&!standalone)setTimeout(()=>toast('Untuk layar penuh: pasang profil dari AirDrop, atau Bagikan → Tambahkan ke Layar Utama.',5200),900);
else if(innerHeight>innerWidth&&!LS.raw('amatu-launcher-rot'))setTimeout(()=>{toast('Putar iPhone ke landscape untuk tampilan desktop.',3800);LS.raw('amatu-launcher-rot','1')},800);
// test hooks: ?open=launchpad|spot|cc|apps|settings|notes|calc|about
const op=Q.get('open');
if(op)setTimeout(()=>{op.split(',').forEach(o=>({launchpad:openLaunchpad,spot:openSpot,cc:openCC})[o]?.()||openWin(o));if(Q.get('q')){$('#spq').value=Q.get('q');renderSpot()}},300);
if(Q.get('edit'))setTimeout(()=>editApp(Q.get('edit')==='new'?null:Q.get('edit')),300);
</script>
